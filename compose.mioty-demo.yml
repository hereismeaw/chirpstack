name: chirpstack-mioty-demo
services:
  demo:
    image: chirpstack-mioty-demo:local
    build:
      context: ./.mioty-demo/context
    init: true
    environment:
      DEMO_HTTP_PORT: ${MIOTY_DEMO_HTTP_PORT:-8080}
      DEMO_MQTT_PORT: ${MIOTY_DEMO_MQTT_PORT:-1884}
    ports:
      - "127.0.0.1:${MIOTY_DEMO_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${MIOTY_DEMO_MQTT_PORT:-1884}:1883"
    volumes:
      - demo-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "/opt/chirpstack/tools/mioty/docker_demo.py", "--healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 180s
      retries: 3
volumes:
  demo-data:
